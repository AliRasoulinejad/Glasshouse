name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  go:
    name: Go tests (inspector, site, gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make test

  web:
    name: Hosted site (types, unit, build, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-deps
      # web-build fails on an unknown action or a step without a captured
      # snapshot; web-browser-test runs the built site in the runner's Chrome.
      - run: make web-test
      - run: make web-browser-test

  gateway-integration:
    name: One real lab through Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make gateway-integration

  images:
    name: Build deploy images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f gateway/Dockerfile -t glasshouse-gateway:ci .
      - run: docker build -t glasshouse-inspector:ci inspector
      # Syntax check only; the dummy key never reaches a running stack.
      - run: GLASSHOUSE_SESSION_KEY=ci-syntax-check-only docker compose -f deploy/compose.yml --env-file deploy/env.example config --quiet
