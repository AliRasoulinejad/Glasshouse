<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glasshouse Inspector</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Glasshouse <span class="muted">Inspector</span></div>
    <div class="target" id="target">—</div>
    <div class="status" id="status" data-state="checking">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Checking…</span>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <main class="layout">
    <section class="view-panel">
      <div class="view-head">
        <h1 id="view-title">Waiting for a snapshot</h1>
        <code class="type" id="view-type"></code>
      </div>
      <div class="view" id="view" aria-live="polite"></div>
    </section>

    <aside class="side">
      <section class="card">
        <h2>Timeline</h2>
        <div class="timeline" id="timeline" role="listbox" aria-label="Event timeline"></div>
        <div class="controls">
          <button id="step-back" type="button" title="Step back">⏮</button>
          <button id="play" type="button" title="Play / pause">▶</button>
          <button id="step-fwd" type="button" title="Step forward">⏭</button>
          <select id="speed" aria-label="Playback speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
          <button id="go-live" type="button" class="primary">Live</button>
        </div>
        <p class="muted small" id="cursor-text">Following live.</p>
      </section>

      <section class="card">
        <h2>Actions</h2>
        <p class="muted small">Pre-scripted operations on the target. Available only while live.</p>
        <div class="actions" id="actions"></div>
        <p class="small" id="action-result" aria-live="polite"></p>
      </section>

      <section class="card">
        <h2>Event detail</h2>
        <pre class="detail" id="detail">Select an event on the timeline.</pre>
      </section>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
