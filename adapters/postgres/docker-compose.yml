# Single Postgres container with pageinspect enabled, for the Postgres
# storage adapter. Local use only.
#
# The published port is bound to 127.0.0.1, so the database is reachable from
# this machine and nothing else. The passwords below are development defaults
# for a throwaway local database; override them through the environment if
# you want.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glasshouse_admin
      POSTGRES_PASSWORD: ${GLASSHOUSE_PG_ADMIN_PASSWORD:-glasshouse-local-admin}
      POSTGRES_DB: glasshouse
      # Read by initdb/01-glasshouse.sh to create the least-privilege role the
      # Inspector connects as.
      GLASSHOUSE_INSPECTOR_PASSWORD: ${GLASSHOUSE_PG_INSPECTOR_PASSWORD:-glasshouse-local-inspector}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glasshouse_admin -d glasshouse"]
      interval: 2s
      timeout: 3s
      retries: 30
