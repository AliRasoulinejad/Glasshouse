# Glasshouse: PostgreSQL 17 with pageinspect, for the storage adapter.
#
# Self-contained on purpose: this one file is what gets pulled from a URL, so
# it cannot depend on sibling files. The first-start init script is inline.
#
# Run it from a URL. The Inspector image is built from source, so the source
# location must be given too (a git URL, or a local path from a checkout):
#   curl -fsSL <url>/compose.yml | GLASSHOUSE_INSPECTOR_CONTEXT=<source> docker compose -f - up -d --wait
#
# Both published ports are bound to 127.0.0.1, so they are reachable from this
# machine only. The Inspector binds 0.0.0.0 inside its own container only; the
# host side stays on loopback. The passwords are development defaults for a
# throwaway local database; override them through the environment.
#
# In this file "$$" is Compose's escape for a literal "$", so the script below
# sees "$POSTGRES_USER" and friends at run time.

configs:
  glasshouse_init:
    content: |
      #!/bin/sh
      # Runs once, on first start, as the superuser.
      #
      # Creates the demo table, and a login role for the Inspector that can only
      # read the page through two wrappers and insert into the demo table.
      set -eu

      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        -v inspector_pw="$$GLASSHOUSE_INSPECTOR_PASSWORD" <<'SQL'
      CREATE EXTENSION IF NOT EXISTS pageinspect;

      CREATE TABLE glasshouse_demo (id int, payload text);
      INSERT INTO glasshouse_demo (id, payload)
        SELECT g, md5(g::text) FROM generate_series(1, 3) AS g;

      CREATE ROLE glasshouse_inspector LOGIN PASSWORD :'inspector_pw';
      GRANT CONNECT ON DATABASE glasshouse TO glasshouse_inspector;
      GRANT USAGE ON SCHEMA public TO glasshouse_inspector;
      GRANT SELECT, INSERT ON glasshouse_demo TO glasshouse_inspector;

      -- pageinspect refuses non-superusers even with EXECUTE granted, so the
      -- Inspector gets two SECURITY DEFINER wrappers owned by the superuser.
      -- Each is hard-wired to glasshouse_demo and takes only a block number.
      CREATE FUNCTION glasshouse_page_header(blk int)
      RETURNS TABLE (lsn text, checksum int, flags int, lower int, upper int,
                     special int, pagesize int, version int, prune_xid text)
      LANGUAGE sql STABLE SECURITY DEFINER SET search_path = pg_catalog, public
      AS $$f$$
        SELECT h.lsn::text, h.checksum::int, h.flags::int, h.lower::int, h.upper::int,
               h.special::int, h.pagesize::int, h.version::int, h.prune_xid::text
        FROM page_header(get_raw_page('glasshouse_demo', blk)) AS h
      $$f$$;

      CREATE FUNCTION glasshouse_heap_page_items(blk int)
      RETURNS TABLE (lp int, lp_off int, lp_flags int, lp_len int,
                     t_xmin text, t_xmax text, t_ctid text,
                     t_infomask2 int, t_infomask int, t_hoff int,
                     t_bits text, t_data_hex text)
      LANGUAGE sql STABLE SECURITY DEFINER SET search_path = pg_catalog, public
      AS $$f$$
        SELECT i.lp::int, i.lp_off::int, i.lp_flags::int, i.lp_len::int,
               i.t_xmin::text, i.t_xmax::text, i.t_ctid::text,
               i.t_infomask2::int, i.t_infomask::int, i.t_hoff::int,
               COALESCE(i.t_bits, ''),
               COALESCE(encode(substring(i.t_data from 1 for 16), 'hex'), '')
        FROM heap_page_items(get_raw_page('glasshouse_demo', blk)) AS i
      $$f$$;

      REVOKE ALL ON FUNCTION glasshouse_page_header(int) FROM PUBLIC;
      REVOKE ALL ON FUNCTION glasshouse_heap_page_items(int) FROM PUBLIC;
      GRANT EXECUTE ON FUNCTION glasshouse_page_header(int) TO glasshouse_inspector;
      GRANT EXECUTE ON FUNCTION glasshouse_heap_page_items(int) TO glasshouse_inspector;
      SQL

services:
  inspector:
    build:
      context: "${GLASSHOUSE_INSPECTOR_CONTEXT:?set GLASSHOUSE_INSPECTOR_CONTEXT to the Inspector source (a git URL or a path to inspector/)}"
    command:
      - -addr
      - 0.0.0.0:8765
      - -adapter
      - postgres
      - -origin
      - ${GLASSHOUSE_ALLOWED_ORIGIN:-https://article.example}
    environment:
      # Connects as the least-privilege role, over the compose network.
      GLASSHOUSE_PG_DSN: postgres://glasshouse_inspector:${GLASSHOUSE_PG_INSPECTOR_PASSWORD:-glasshouse-local-inspector}@postgres:5432/glasshouse?sslmode=disable
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glasshouse_admin
      POSTGRES_PASSWORD: ${GLASSHOUSE_PG_ADMIN_PASSWORD:-glasshouse-local-admin}
      POSTGRES_DB: glasshouse
      # Read by the init script to set the Inspector role's password.
      GLASSHOUSE_INSPECTOR_PASSWORD: ${GLASSHOUSE_PG_INSPECTOR_PASSWORD:-glasshouse-local-inspector}
    ports:
      - "127.0.0.1:55432:5432"   # for host psql only; the Inspector uses the network
    configs:
      - source: glasshouse_init
        target: /docker-entrypoint-initdb.d/01-glasshouse.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glasshouse_admin -d glasshouse"]
      interval: 2s
      timeout: 3s
      retries: 30
